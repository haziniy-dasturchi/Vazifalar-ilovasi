# =============================================================
# Vazifalar — Supabase lokal konfiguratsiyasi
# =============================================================
# Ishga tushirish:  supabase start
# Bazani tiklash:   supabase db reset   (migratsiyalar + seed.sql)

project_id = "vazifalar"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
# Frontend manzili (keyingi bosqichda Next.js shu portda ishlaydi)
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

# Ilovada faqat Google orqali kirish bor — email/parol o'chirilgan
[auth.email]
enable_signup = false
enable_confirmations = false
double_confirm_changes = false

[auth.sms]
enable_signup = false

[auth.external.google]
enabled = true
# Qiymatlar .env faylidan olinadi (supabase/.env yoki muhit o'zgaruvchilari)
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
# Bo'sh bo'lsa Supabase o'zining callback manzilini ishlatadi
redirect_uri = ""
skip_nonce_check = false
